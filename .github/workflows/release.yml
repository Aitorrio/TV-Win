name: Release Windows

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve channel
        id: meta
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          if ($branch -eq "beta") {
            $tag = "latest-beta"
            $name = "TV-Win latest-beta"
            $channel = "beta"
          } else {
            $tag = "latest-stable"
            $name = "TV-Win latest-stable"
            $channel = "stable"
          }
          $version = (Select-String -Path "tvwin/__init__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "channel=$channel tag=$tag version=$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Fetch embedded mpv
        shell: pwsh
        run: ./scripts/fetch_mpv.ps1

      - name: Fetch embedded ffmpeg
        shell: pwsh
        run: ./scripts/fetch_ffmpeg.ps1

      - name: Build portable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --windowed `
            --name TV-Win `
            --onedir `
            --clean `
            --icon "assets/tv-win.ico" `
            --add-data "assets;assets" `
            --add-binary "player/mpv.exe;player" `
            --add-binary "player/ffmpeg.exe;player" `
            --collect-all streamlink `
            --collect-all pystray `
            --hidden-import streamlink.plugins.atresplayer `
            --hidden-import PIL `
            --hidden-import PIL._tkinter_finder `
            main.py
          New-Item -ItemType Directory -Force -Path "dist/TV-Win/player" | Out-Null
          Copy-Item "player/mpv.exe" "dist/TV-Win/player/mpv.exe" -Force
          Copy-Item "player/ffmpeg.exe" "dist/TV-Win/player/ffmpeg.exe" -Force
          New-Item -ItemType Directory -Force -Path "dist/TV-Win/assets" | Out-Null
          Copy-Item -Recurse -Force "assets/*" "dist/TV-Win/assets/"
          Set-Content -Path "dist/TV-Win/version.txt" -Value "${{ steps.meta.outputs.version }}" -Encoding utf8
          if (-not (Test-Path "dist/TV-Win/player/mpv.exe") -and -not (Test-Path "dist/TV-Win/_internal/player/mpv.exe")) {
            throw "Build sin mpv.exe"
          }
          if (-not (Test-Path "dist/TV-Win/player/ffmpeg.exe") -and -not (Test-Path "dist/TV-Win/_internal/player/ffmpeg.exe")) {
            throw "Build sin ffmpeg.exe"
          }

      - name: Pack ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $channel = "${{ steps.meta.outputs.channel }}"
          @"
          TV-Win $ver ($channel)
          Televisión en abierto para Windows
          Autor: Aitor Riolobos (EA4HBL)
          https://github.com/Aitorrio/TV-Win

          1. Extrae esta carpeta
          2. Ejecuta TV-Win.exe
          3. Elige un canal (doble clic o Ver canal)

          Controles: Enter ver · Esc parar · F favorito · F11 pantalla · PgUp/PgDn zap
          "@ | Set-Content -Path "dist/TV-Win/LEEME.txt" -Encoding UTF8
          $zip = "TV-Win-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/TV-Win/*" -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Win-windows-x64-${{ steps.meta.outputs.channel }}
          path: TV-Win-windows-x64.zip

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.channel == 'beta' }}
          target_commitish: ${{ github.sha }}
          files: TV-Win-windows-x64.zip
          make_latest: ${{ steps.meta.outputs.channel == 'stable' }}
          body: |
            ## TV-Win ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.channel }})

            Portable para Windows x64. Extrae y ejecuta `TV-Win.exe`.

            - Atresplayer: Streamlink + ffmpeg → mpv (sin ventana CMD)
            - Favoritos, zapping, pantalla completa, logos y bandeja
            - Actualización desde la propia app (Estable / Beta)

            Autor: **Aitor Riolobos (EA4HBL)** · https://github.com/Aitorrio

            <!-- tv-win-build: version=${{ steps.meta.outputs.version }} -->
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
